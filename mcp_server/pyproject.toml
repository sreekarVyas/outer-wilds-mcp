[project]
name = "game-context-provider"
version = "0.1.0"
description = "MCP server exposing live, semantically-resolved game context to an AI assistant"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gcp-server = "gcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
